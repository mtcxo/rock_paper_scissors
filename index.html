<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body>
  <div class="result"></div>

  <button class="rock">rock</button>
  <button class="paper">paper</button>
  <button class="scissors">scissors</button>

  <script>
    let computerScore = 0;
    let humanScore = 0;

    function getComputerChoice() {

      let hand = Math.floor(Math.random() * 100) + 1;

      if (hand > 0 && hand <= 33) {
        return "rock";
      } else if (hand > 33 && hand <= 66) {
        return "paper";
      } else if (hand > 66 && hand <= 100) {
        return "scissors";
      }
    }


    function playRound(event) {
      let cpuChoice = getComputerChoice();
      let humanChoice = event.target.innerText;

      let result = document.querySelector(".result");
      let message = "";

      if (humanChoice == "rock") {
        if (cpuChoice == "rock") {
          message = "U both made rock. Tie!";
        } else if (cpuChoice == "paper") {
          message = "You lost. COM:paper beat you:rock.";
          computerScore++;
        } else if (cpuChoice == "scissors") {
          message = "You won. you:rock beat com:scissors!";
          humanScore++;
        }
      } else if (humanChoice == "paper") {
        if (cpuChoice == "paper") {
          message = "U both made paper. Tie!";
        } else if (cpuChoice == "scissors") {
          message = "You lost. COM:scissors beat you:paper.";
          computerScore++;
        } else if (cpuChoice == "rock") {
          message = "You won. you:paper beat com:rock!";
          humanScore++;
        }
      } else if (humanChoice == "scissors") {
        if (cpuChoice == "scissors") {
          message = "U both made scissors. Tie!";
        } else if (cpuChoice == "rock") {
          message = "You lost. COM:rock beat you:scissors.";
          computerScore++;
        } else if (cpuChoice == "paper") {
          message = "You won. you:scissors beat com:paper!";
          humanScore++;
        }
      }

      if (computerScore === 5 || humanScore === 5) {
        let winner = humanScore === 5 ? "You win the game!" : "Computer wins the game!";
        message += `<br><strong>${winner}</strong>`;

        // Disable buttons
        document.querySelectorAll("button").forEach(btn => btn.remove());
      }

      result.innerHTML = (`<p>${message}</p>

      <p>  current score~~ <br> you: ${humanScore} || computer: ${computerScore}
        </p>`)

    }

    document.querySelector(".rock").addEventListener("click", playRound);
    document.querySelector(".paper").addEventListener("click", playRound);
    document.querySelector(".scissors").addEventListener("click", playRound);


  </script>
</body>

</html>
